name: Daily offsite backup
on:
  schedule:
    - cron: "17 19 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
      AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.BACKUP_AWS_REGION }}
      BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - name: Require offsite backup credentials
        run: |
          for name in DATABASE_URL AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_DEFAULT_REGION BACKUP_S3_BUCKET; do
            if [ -z "${!name}" ]; then echo "::error::Missing backup secret: $name"; exit 1; fi
          done
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Backup database and upload offsite
        run: |
          bash scripts/backup_restore.sh backup backups
          DB_FILE="$(find backups -maxdepth 1 -name 'db_*.dump' -print -quit)"
          test -n "$DB_FILE"
          echo "DB_FILE=$DB_FILE" >> "$GITHUB_ENV"
          echo "DB_BASENAME=$(basename "$DB_FILE")" >> "$GITHUB_ENV"
          aws s3 cp "$DB_FILE" "s3://$BACKUP_S3_BUCKET/cntagram/$(basename "$DB_FILE")" --sse AES256 --no-progress
      - name: Confirm this run's database backup exists offsite
        run: |
          aws s3api head-object             --bucket "$BACKUP_S3_BUCKET"             --key "cntagram/$DB_BASENAME"             >/dev/null
          echo "✓ Current-run database dump verified: s3://$BACKUP_S3_BUCKET/cntagram/$DB_BASENAME"
      - name: Explain media-vault backup boundary
        run: |
          echo "::notice::This GitHub-hosted runner cannot access files stored on a Render Web Service persistent disk. Media-vault backup must be executed from the service that owns the disk or after migrating media to external object storage."
      - name: Notify on backup failure
        if: failure()
        run: |
          echo "::error title=Backup Failed::Daily offsite backup workflow failed. Repository maintainers are notified via GitHub Actions alert."
