name: Webboard screenshot evidence

on:
  push:
    branches:
      - feature/issue-197-webboard-forum

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEBUG: "True"
      SECRET_KEY: "ci-webboard-screenshot-evidence-only-not-production"
      ALLOWED_HOSTS: "127.0.0.1,localhost"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install app dependencies and Playwright
        run: |
          pip install -r requirements.txt
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Prepare SQLite database and demo webboard data
        run: |
          python manage.py migrate
          python manage.py shell <<'PY'
          from django.contrib.auth import get_user_model
          from django.utils import timezone
          from catalog.models import Department
          from webboard.models import BoardCategory, Thread

          User = get_user_model()
          dept, _ = Department.objects.get_or_create(
              code="CN",
              defaults={
                  "name_th": "วิศวกรรมคอมพิวเตอร์",
                  "name_en": "Computer Engineering",
              },
          )
          user, created = User.objects.get_or_create(
              email="webboard.evidence@student.tu.ac.th",
              defaults={
                  "nickname": "WebboardEvidence",
                  "department": dept,
                  "pdpa_consent_at": timezone.now(),
              },
          )
          user.department = dept
          user.nickname = "WebboardEvidence"
          user.pdpa_consent_at = user.pdpa_consent_at or timezone.now()
          user.set_password("Evidence-Only-123!")
          user.save()

          category = BoardCategory.objects.order_by("order", "id").first()
          if category is None:
              category = BoardCategory.objects.create(
                  name="ห้องวิชาการ",
                  slug="academic",
                  description="พูดคุยเรื่องเรียนและแบ่งปันประสบการณ์",
                  order=1,
              )

          Thread.objects.update_or_create(
              pk=1,
              defaults={
                  "category": category,
                  "author": user,
                  "title": "เทคนิคการอ่านสอบไฟนอล",
                  "content": "แชร์วิธีเตรียมสอบ CN101 ครับ :) [img]https://media.giphy.com/media/ICOgUNjpvO0PC/giphy.gif[/img]",
              },
          )
          PY

      - name: Start Django server
        run: |
          python manage.py runserver 127.0.0.1:8000 --noreload > /tmp/webboard-server.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/login/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/webboard-server.log
          exit 1

      - name: Capture board and thread screenshots
        run: |
          mkdir -p screenshot-evidence
          python <<'PY'
          from playwright.sync_api import sync_playwright

          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page(viewport={"width": 1440, "height": 1100})
              page.goto("http://127.0.0.1:8000/login/", wait_until="networkidle")
              page.locator('input[name="username"]').fill("webboard.evidence@student.tu.ac.th")
              page.locator('input[name="password"]').fill("Evidence-Only-123!")
              page.locator('button[type="submit"]').click()
              page.wait_for_load_state("networkidle")

              page.goto("http://127.0.0.1:8000/webboard/", wait_until="networkidle")
              page.screenshot(path="screenshot-evidence/webboard-index.png", full_page=True)

              page.goto("http://127.0.0.1:8000/webboard/thread/1/", wait_until="networkidle")
              page.screenshot(path="screenshot-evidence/webboard-thread.png", full_page=True)

              browser.close()
          PY

      - name: Upload screenshot evidence
        uses: actions/upload-artifact@v4
        with:
          name: webboard-screenshot-evidence
          path: screenshot-evidence/*.png
          if-no-files-found: error
          retention-days: 30
