<nav class="cyber-nav" aria-label="เมนูหลัก">
    <div class="container-xl cyber-nav__surface">
        <span class="nav-widget-label" aria-hidden="true">MENU.EXE</span>
        <div class="cyber-nav__links">
            <a class="capsule-link retro-tab{% if request.resolver_match.url_name == 'home' %} is-active{% endif %}"
               href="{% url 'accounts:home' %}">
                <span class="capsule-link__icon" aria-hidden="true">⌂</span>
                หน้าแรก <small>HOME</small>
            </a>
            {% if request.user.is_authenticated %}
                <a class="capsule-link retro-tab{% if request.resolver_match.url_name == 'vault' %} is-active{% endif %}"
                   href="{% url 'materials:vault' %}">
                    <span class="capsule-link__icon" aria-hidden="true">▣</span>
                    คลังเอกสาร <small>VAULT</small>
                </a>
                <a class="capsule-link retro-tab{% if request.resolver_match.url_name == 'upload' %} is-active{% endif %}"
                   href="{% url 'materials:upload' %}">
                    <span class="capsule-link__icon" aria-hidden="true">↑</span>
                    อัปโหลด <small>UPLOAD</small>
                </a>
            {% endif %}
        </div>

        <div class="cyber-nav__account">
            {% if request.user.is_authenticated %}
                <span class="identity-capsule" title="สมาชิกที่เข้าสู่ระบบแล้ว">
                    <span class="identity-capsule__signal" aria-hidden="true"></span>
                    {{ request.user.nickname }}
                </span>
                <form method="post" action="{% url 'accounts:logout' %}">
                    {% csrf_token %}
                    <button class="chrome-button chrome-button--quiet" type="submit">ออกจากระบบ</button>
                </form>
            {% else %}
                <a class="chrome-button chrome-button--quiet" href="{% url 'accounts:login' %}"><span aria-hidden="true">●</span> เข้าสู่ระบบ</a>
                <a class="chrome-button chrome-button--brand" href="{% url 'accounts:register' %}"><span aria-hidden="true">♥</span> สมัครสมาชิก</a>
            {% endif %}
        </div>
    </div>
</nav>
