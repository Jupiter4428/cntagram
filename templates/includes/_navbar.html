{% load static %}
<nav class="cyber-nav" aria-label="เมนูหลัก">
    <div class="cyber-nav__surface">
        <div class="cyber-nav__links">
            <a class="capsule-link retro-tab{% if request.resolver_match.url_name == 'home' %} is-active{% endif %}"
               href="{% url 'accounts:home' %}">
                <img src="{% static 'img/icons/house.png' %}" width="16" height="16" class="pixel-icon" alt="" aria-hidden="true">
                หน้าแรก
            </a>
            <a class="capsule-link retro-tab{% if request.resolver_match.app_name == 'webboard' %} is-active{% endif %}"
               href="{% url 'webboard:index' %}">
                <img src="{% static 'img/icons/note.png' %}" width="16" height="16" class="pixel-icon" alt="" aria-hidden="true">
                เว็บบอร์ด
            </a>
            {% if request.user.is_authenticated %}
                <a class="capsule-link retro-tab{% if request.resolver_match.url_name == 'vault' %} is-active{% endif %}"
                   href="{% url 'materials:vault' %}">
                    <img src="{% static 'img/icons/folder_page.png' %}" width="16" height="16" class="pixel-icon" alt="" aria-hidden="true">
                    คลังเอกสาร
                </a>
                <a class="capsule-link retro-tab{% if request.resolver_match.url_name == 'upload' or request.resolver_match.url_name == 'upload_done' %} is-active{% endif %}"
                   href="{% url 'materials:upload' %}">
                    <img src="{% static 'img/icons/page_white_get.png' %}" width="16" height="16" class="pixel-icon" alt="" aria-hidden="true">
                    อัปโหลดชีท
                </a>
            {% endif %}
        </div>

        <div class="cyber-nav__account">
            {% if request.user.is_authenticated %}
                <span class="identity-capsule" title="สมาชิกที่เข้าสู่ระบบแล้ว">
                    <span class="identity-capsule__signal" aria-hidden="true"></span>
                    {{ request.user.nickname }}
                </span>
                <a class="chrome-button chrome-button--quiet" href="{% url 'accounts:delete_account' %}">ลบบัญชี</a>
                <form method="post" action="{% url 'accounts:logout' %}">
                    {% csrf_token %}
                    <button class="chrome-button chrome-button--quiet" type="submit">ออกจากระบบ</button>
                </form>
            {% else %}
                <a class="chrome-button chrome-button--quiet" href="{% url 'accounts:login' %}">เข้าสู่ระบบ</a>
                <a class="chrome-button chrome-button--brand" href="{% url 'accounts:register' %}">สมัครสมาชิก</a>
            {% endif %}
        </div>
    </div>
</nav>
