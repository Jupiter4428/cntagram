<details class="retro-widget music-widget compact-disclosure">
    <summary class="retro-widget__header retro-widget__titlebar retro-widget__titlebar--pink">
        <span aria-hidden="true">♫</span>
        <strong id="music-player-title">BGM Player</strong>
        <span class="compact-disclosure__state" aria-hidden="true"></span>
    </summary>
    <div class="retro-widget__body compact-disclosure__body" aria-labelledby="music-player-title">
        <div class="music-widget__display">
            <span class="music-widget__disc" aria-hidden="true"></span>
            <div>
                <span>PLAYBACK STATUS</span>
                <strong>COMING SOON</strong>
                <small>sleep deprived certified mix</small>
            </div>
        </div>
        <div class="music-widget__progress" aria-hidden="true"><span></span></div>
        <p class="music-widget__note">Decorative UI only · ไม่มีเสียง ไม่มีปุ่มเล่น และไม่ autoplay</p>
    </div>
</details>
