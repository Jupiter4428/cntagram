<div class="poll-results" aria-label="ผลโหวตล่าสุด">
    {% for choice in poll.choices %}
        <div class="poll-result-row">
            <div class="poll-result-label">
                <span>{{ choice.label }}</span>
                <b>{{ choice.percent }}% ({{ choice.votes }})</b>
            </div>
            <div class="poll-bar-wrap">
                <div class="poll-bar-fill" style="width: {{ choice.percent }}%;"></div>
            </div>
        </div>
    {% endfor %}
</div>
<p class="demo-note mb-1 text-center">ผลโหวตทั้งหมด {{ poll.total }} เสียง</p>
<a href="?poll_view=form" class="chrome-button chrome-button--quiet w-100 text-center d-block">ดูตัวเลือก / โหวตใหม่</a>
