<details class="retro-widget counter-widget compact-disclosure" open>
    <summary class="retro-widget__header retro-widget__titlebar">
        <span aria-hidden="true">▦</span>
        <strong id="visitor-counter-title">Visitor Counter</strong>
        <span class="compact-disclosure__state" aria-hidden="true"></span>
    </summary>
    <div class="retro-widget__body counter-widget__body compact-disclosure__body" aria-labelledby="visitor-counter-title">
        <span class="counter-widget__label">คุณคือผู้เข้าชมคนที่</span>
        {% with digits=visitor_digits|default:"000038" %}
        <output class="retro-counter pixel-counter" aria-label="หมายเลขผู้เข้าชมตัวอย่าง {{ digits }}">
            {% for digit in digits %}<span>{{ digit }}</span>{% endfor %}
        </output>
        {% endwith %}
        <p>Decorative only · ไม่ใช่ยอดผู้เข้าชมจริง</p>
    </div>
</details>
