<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}CNTAGRAM{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container">
            <a class="navbar-brand" href="{% url 'accounts:home' %}">CNTAGRAM</a>
            <div class="d-flex gap-2 align-items-center">
                {% if request.user.is_authenticated %}
                    <a class="btn btn-outline-primary" href="{% url 'materials:vault' %}">Vault</a>
                    <span>{{ request.user.nickname }}</span>
                    <form method="post" action="{% url 'accounts:logout' %}">
                        {% csrf_token %}
                        <button class="btn btn-outline-danger" type="submit">Logout</button>
                    </form>
                {% else %}
                    <a class="btn btn-outline-primary" href="{% url 'accounts:login' %}">Login</a>
                    <a class="btn btn-primary" href="{% url 'accounts:register' %}">Register</a>
                {% endif %}
            </div>
        </div>
    </nav>
    <main class="container py-5">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
