{% extends "admin_page.html" %}

{% block title %}ยืนยันการลบ{% endblock %}

{% block content %}
  <h1>ยืนยันการลบรุ่น {{ batch.code }}</h1>
  <p>คุณแน่ใจหรือไม่ว่าต้องการลบรุ่น {{ batch.code }}?</p>

  <form method="post">
    {% csrf_token %}
    <button type="submit">ยืนยันการลบ</button>
    <a href="{% url 'catalog:batch_list' %}">ยกเลิก</a>
  </form>
{% endblock %}
