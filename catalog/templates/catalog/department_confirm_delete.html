<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>ยืนยันการลบ</title>
</head>
<body>
    <h1>ยืนยันการลบภาควิชา {{ dept.code }}</h1>
    <p>คุณแน่ใจหรือไม่ว่าต้องการลบภาควิชา {{ dept.name_th }}?</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit">ยืนยันการลบ</button>
        <a href="{% url 'catalog:department_list' %}">ยกเลิก</a>
    </form>
</body>
</html>
