<div class="row justify-content-center">
    <div class="col-12 col-lg-10">
        <!-- Breadcrumb & Header -->
        <nav aria-label="breadcrumb" class="mb-3">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="{% url 'materials:approval_queue' %}" class="text-decoration-none">คิวรออนุมัติ</a></li>
                <li class="breadcrumb-item active" aria-current="page">พิจารณาเอกสาร </li>
            </ol>
        </nav>

        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="h2 fw-bold mb-1">พิจารณาอนุมัติเอกสาร</h1>
                <p class="text-muted mb-0">ตรวจสอบความถูกต้องและเนื้อหาของชีทสรุป/สไลด์ก่อนเผยแพร่สู่คลังเอกสาร</p>
            </div>
            <div>
                    <span class="badge bg-warning text-dark fs-6 px-3 py-2">สถานะ: รอพิจารณา </span>
                    <span class="badge bg-success fs-6 px-3 py-2">สถานะ: เผยแพร่แล้ว </span>
                    <span class="badge bg-danger fs-6 px-3 py-2">สถานะ: ถูกปฏิเสธ </span>
              
            </div>
        </div>

        <div class="row g-4">
            <!-- Left Column: Document Details & File Card -->
            <div class="col-12 col-lg-7">
                <div class="card border-0 shadow-sm rounded-3 mb-4">
                    <div class="card-header bg-white py-3 border-bottom">
                        <h2 class="h5 fw-bold mb-0 text-dark">ข้อมูลเอกสาร</h2>
                    </div>
                    <div class="card-body p-4">
                        <div class="mb-3">
                            <label class="text-muted small fw-semibold d-block">ชื่อเอกสาร</label>
                            <div class="fs-5 fw-bold text-dark"></div>
                        </div>

                        <div class="mb-3">
                            <label class="text-muted small fw-semibold d-block">คำอธิบาย</label>
                            <div class="bg-light p-3 rounded-2 text-secondary" style="white-space: pre-wrap;"></div>
                        </div>

                        <div class="row g-3 pt-2">
                            <div class="col-sm-6">
                                <label class="text-muted small fw-semibold d-block">รายวิชา</label>
                                <div class="fw-semibold text-primary">
                                    
                                </div>
                            </div>
                            <div class="col-sm-6">
                                <label class="text-muted small fw-semibold d-block">ภาควิชา และ รุ่น</label>
                                <div>
                                    <span class="badge bg-info-subtle text-info-emphasis">
                                        
                                    </span>
                                    <span class="ms-1 fw-semibold"> </span>
                                </div>
                            </div>
                            <div class="col-sm-6">
                                <label class="text-muted small fw-semibold d-block">ประเภทเอกสาร</label>
                                <span class="badge bg-light text-dark border">
                                    
                                </span>
                            </div>
                            <div class="col-sm-6">
                                <label class="text-muted small fw-semibold d-block">ผู้อัปโหลด</label>
                                <span class="fw-medium text-dark"></span>
                                <small class="text-muted"></small>
                            </div>
                            <div class="col-sm-6">
                                <label class="text-muted small fw-semibold d-block">วันที่ส่งเอกสาร</label>
                                <span class="text-muted"></span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- File Info Card -->
                <div class="card border-0 shadow-sm rounded-3">
                    <div class="card-header bg-white py-3 border-bottom">
                        <h2 class="h5 fw-bold mb-0 text-dark">ไฟล์แนบ </h2>
                    </div>
                    <div class="card-body p-4">
                      
                            <div class="d-flex align-items-center p-3 border rounded-3 bg-light">
                                <div class="display-6 me-3 text-primary"></div>
                                <div class="flex-grow-1">
                                    <div class="fw-bold text-dark text-break"></div>
                                    <div class="small text-muted">
                                        เวอร์ชัน: | 
                                        ขนาด: |
                                        อัปโหลด: 
                                    </div>
                                    <div class="small text-muted mt-1">
                                        SHA256: <code class="text-muted"></code>
                                    </div>
                                </div>
                            </div>
                          
                            <iframe src="{{ preview_url }}" title="" class="pdf-preview w-100 mt-3 border rounded-3" style="height: 70vh;"></iframe>
                            <div class="mt-2">
                                <a href="{{ preview_url }}" target="_blank" rel="noopener" class="btn btn-outline-secondary btn-sm">เปิดไฟล์ในแท็บใหม่</a>
                            </div>
                       
                            <p class="text-muted mb-0"></p>
                        
                    </div>
                </div>
            </div>

            <!-- Right Column: Review Action Form Card -->
            <div class="col-12 col-lg-5">
                <div class="card border-0 shadow-sm rounded-3 sticky-top" style="top: 1.5rem;">
                    <div class="card-header bg-white py-3 border-bottom">
                        <h2 class="h5 fw-bold mb-0 text-dark">แบบฟอร์มการพิจารณา</h2>
                    </div>
                    <div class="card-body p-4">
                        <form method="post" action="{% url 'materials:approval_review' document.id %}" novalidate>
                         

                           
                                <div class="alert alert-danger" role="alert">
                                    
                                </div>
                           

                            <label class="form-label fw-bold mb-2">เลือกผลการพิจารณา <span class="text-danger">*</span></label>
                            <div class="row g-2 mb-3">
                                <div class="col-6">
                                    <input type="radio" class="btn-check" name="decision" id="decision_approved" value="approved" {% if form.decision.value == 'approved' %}checked{% endif %}>
                                    <label class="btn btn-outline-success w-100 py-3 fw-bold d-flex flex-column align-items-center justify-content-center gap-1 rounded-3" for="decision_approved">
                                        <span class="fs-4">✅</span>
                                        <span>อนุมัติ </span>
                                    </label>
                                </div>
                                <div class="col-6">
                                    <input type="radio" class="btn-check" name="decision" id="decision_rejected" value="rejected" {% if form.decision.value == 'rejected' %}checked{% endif %}>
                                    <label class="btn btn-outline-danger w-100 py-3 fw-bold d-flex flex-column align-items-center justify-content-center gap-1 rounded-3" for="decision_rejected">
                                        <span class="fs-4">❌</span>
                                        <span>ปฏิเสธ </span>
                                    </label>
                                </div>
                            </div>
                            
                                <div class="text-danger small mb-3">
                                    
                            

                            <div class="mb-4">
                                <label class="form-label fw-bold" for="{{ form.reason.id_for_label }}">
                                   
                                    <span class="text-danger fw-normal" id="reason-required-hint" style="display: none;"></span>
                                </label>
                                
                                    <div class="invalid-feedback d-block">
                                        
                                    </div>
                             
                                <div class="form-text mt-1 text-muted" style="font-size: 0.75rem;">
                                   
                                </div>
                            </div>

                            <div class="d-grid gap-2 review-action-buttons">
                                <button type="submit" class="btn btn-primary btn-lg fw-semibold shadow-sm">
                                        บันทึก
                                </button>
                                <a href="{% url 'materials:approval_queue' %}" class="btn btn-outline-secondary">
                                ยกเลิก 
                                </a>
                            </div>
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const approveRadio = document.getElementById('decision_approved');
        const rejectRadio = document.getElementById('decision_rejected');
        const reasonHint = document.getElementById('reason-required-hint');
        const reasonInput = document.getElementById('{{ form.reason.id_for_label }}');

        function updateState() {
            if (rejectRadio && rejectRadio.checked) {
                if (reasonHint) reasonHint.style.display = 'inline';
                if (reasonInput) reasonInput.setAttribute('placeholder', 'ระบุเหตุผลที่ปฏิเสธเอกสารนี้ (บังคับกรอก)');
            } else {
                if (reasonHint) reasonHint.style.display = 'none';
                if (reasonInput) reasonInput.setAttribute('placeholder', 'ระบุเหตุผล (บังคับกรอกกรณีปฏิเสธ)');
            }
        }

        if (approveRadio) approveRadio.addEventListener('change', updateState);
        if (rejectRadio) rejectRadio.addEventListener('change', updateState);
        updateState();
    });
</script>
