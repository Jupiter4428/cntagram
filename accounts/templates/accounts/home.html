{% extends "base.html" %}

{% block title %}Home | CNTAGRAM{% endblock %}

{% block content %}
<h1>CNTAGRAM</h1>
<p>Share and discover study materials from the engineering community.</p>
{% if request.user.is_authenticated %}
    <a class="btn btn-primary" href="{% url 'materials:vault' %}">Open document vault</a>
{% else %}
    <a class="btn btn-primary" href="{% url 'accounts:login' %}">Login</a>
{% endif %}
{% endblock %}
